services:
  postgres:
    image: postgres:17-alpine
    container_name: workout-journal-postgres
    environment:
      POSTGRES_DB: workout_journal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workout_journal"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workout-journal-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/workout_journal
      SECRET_KEY: change-me-for-production-workout-journal
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
